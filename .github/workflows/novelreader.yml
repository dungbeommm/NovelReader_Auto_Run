name: NovelReader automation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [novelreader_job]
  workflow_dispatch:
    inputs:
      mode:
        description: Workflow execution mode
        required: true
        default: health-check
        type: choice
        options:
          - health-check
          - poll-telegram
          - run-molab-browser

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app notebook browser tests
      - run: python -m unittest discover -s tests -v
      - run: marimo check notebook/NovelReader_Auto_Run.py

  poll-telegram:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'poll-telegram')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: novelreader-telegram-poller
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Poll Telegram and dispatch queued jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_TELEGRAM_USER_IDS: ${{ secrets.ALLOWED_TELEGRAM_USER_IDS }}
          STORAGE_BACKEND: huggingface
          HF_BUCKET_ID: ${{ vars.HF_BUCKET_ID || 'uri410/audio' }}
          HF_ROOT_PREFIX: ${{ vars.HF_ROOT_PREFIX || 'novelreader' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_ACTIONS_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m app.telegram_bot --poll-seconds 220

  run-molab-browser:
    if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'run-molab-browser')
    runs-on: [self-hosted, Windows, molab-vm]
    timeout-minutes: 330
    concurrency:
      group: novelreader-molab-profile
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install chromium
      - name: Restore encrypted login and run MoLab job
        env:
          MOLAB_NOTEBOOK_URL: ${{ vars.MOLAB_NOTEBOOK_URL || 'https://molab.marimo.io/notebooks/nb_HCLKeWuzfZyxDmgL44Sws5' }}
          MOLAB_BROWSER_PROFILE: ${{ vars.MOLAB_BROWSER_PROFILE || 'C:\molab-browser-profile' }}
          STORAGE_BACKEND: huggingface
          HF_BUCKET_ID: ${{ vars.HF_BUCKET_ID || 'uri410/audio' }}
          HF_ROOT_PREFIX: ${{ vars.HF_ROOT_PREFIX || 'novelreader' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MOLAB_PROFILE_ENCRYPTION_KEY: ${{ secrets.MOLAB_PROFILE_ENCRYPTION_KEY }}
          NOVELREADER_JOB_ID: ${{ github.event.client_payload.job_id || '' }}
        run: python -m browser.molab_controller --notebook-url "$env:MOLAB_NOTEBOOK_URL" --storage huggingface --profile-dir "$env:MOLAB_BROWSER_PROFILE" --sync-profile

  health-check:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'health-check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check Hugging Face bucket access
        env:
          STORAGE_BACKEND: huggingface
          HF_BUCKET_ID: ${{ vars.HF_BUCKET_ID || 'uri410/audio' }}
          HF_ROOT_PREFIX: ${{ vars.HF_ROOT_PREFIX || 'novelreader' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c 'from app.storage import create_store; s=create_store(); p=s.ensure_folder("healthcheck"); s.put_json(p,"check.json",{"ok": True}); assert s.get_json(p,"check.json")=={"ok": True}; print("Hugging Face bucket connection OK")'
