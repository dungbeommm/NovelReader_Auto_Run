name: NovelReader automation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Check storage or poll Telegram once
        required: true
        default: health-check
        type: choice
        options:
          - health-check
          - poll-telegram

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app notebook tests
      - run: python -m unittest discover -s tests -v
      - run: marimo check notebook/NovelReader_Auto_Run.py

  poll-telegram:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'poll-telegram')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: novelreader-telegram-poller
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Poll Telegram and deliver notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_TELEGRAM_USER_IDS: ${{ secrets.ALLOWED_TELEGRAM_USER_IDS }}
          STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND || 'r2' }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ROOT_PREFIX: ${{ vars.R2_ROOT_PREFIX }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          PIXELDRAIN_ROOT_PATH: ${{ vars.PIXELDRAIN_ROOT_PATH }}
        run: python -m app.telegram_bot --poll-seconds 220

  health-check:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'health-check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check storage connection
        env:
          STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND || 'r2' }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ROOT_PREFIX: ${{ vars.R2_ROOT_PREFIX }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          PIXELDRAIN_ROOT_PATH: ${{ vars.PIXELDRAIN_ROOT_PATH }}
        run: |
          python - <<'PY'
          from app.storage import create_store
          store = create_store()
          store.list_children(store.root_id)
          print(f"Storage connection OK: {type(store).__name__}")
          PY
