name: NovelReader automation

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
  schedule:
    - cron: "0 */5 * * *"
  repository_dispatch:
    types: [novelreader_job]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app notebook browser tests
      - run: python -m unittest discover -s tests -v
      - run: marimo check notebook/NovelReader_Auto_Run.py

  poll-telegram:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: continuous-telegram-bot
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify Hugging Face storage before starting the bot
        env:
          STORAGE_BACKEND: huggingface
          HF_BUCKET_ID: ${{ vars.HF_BUCKET_ID || 'uri410/audio' }}
          HF_ROOT_PREFIX: ${{ vars.HF_ROOT_PREFIX || 'novelreader' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          from app.storage import create_store
          store = create_store()
          folder = store.ensure_folder("healthcheck")
          store.put_json(folder, "check.json", {"ok": True})
          assert store.get_json(folder, "check.json") == {"ok": True}
          print("HF storage ready")
          PY
      - name: Run Telegram bot with continuous watchdog and handover
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_TELEGRAM_USER_IDS: ${{ secrets.ALLOWED_TELEGRAM_USER_IDS }}
          STORAGE_BACKEND: huggingface
          HF_BUCKET_ID: ${{ vars.HF_BUCKET_ID || 'uri410/audio' }}
          HF_ROOT_PREFIX: ${{ vars.HF_ROOT_PREFIX || 'novelreader' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_ACTIONS_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NOVELREADER_WORKFLOW_FILE: novelreader.yml
          PYTHONUNBUFFERED: "1"
          PYTHONUTF8: "1"
        run: python -m app.github_runner

  run-molab-browser:
    if: github.event_name == 'repository_dispatch'
    runs-on: [self-hosted, Windows, molab-vm]
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install chromium
      - name: Restore encrypted login and run MoLab job
        env:
          MOLAB_NOTEBOOK_URL: ${{ vars.MOLAB_NOTEBOOK_URL || 'https://molab.marimo.io/notebooks/nb_HCLKeWuzfZyxDmgL44Sws5' }}
          MOLAB_BROWSER_PROFILE: ${{ vars.MOLAB_BROWSER_PROFILE || 'C:\molab-browser-profile' }}
          STORAGE_BACKEND: huggingface
          HF_BUCKET_ID: ${{ vars.HF_BUCKET_ID || 'uri410/audio' }}
          HF_ROOT_PREFIX: ${{ vars.HF_ROOT_PREFIX || 'novelreader' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MOLAB_PROFILE_ENCRYPTION_KEY: ${{ secrets.MOLAB_PROFILE_ENCRYPTION_KEY }}
          NOVELREADER_JOB_ID: ${{ github.event.client_payload.job_id || '' }}
        run: python -m browser.molab_controller --notebook-url "$env:MOLAB_NOTEBOOK_URL" --storage huggingface --profile-dir "$env:MOLAB_BROWSER_PROFILE" --sync-profile
